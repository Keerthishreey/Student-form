<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      margin: auto;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .buttons {
      margin-top: 15px;
      text-align: center;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .error {
  color: red;
  font-size: 12px;
}

    .submit {
      background-color: #4CAF50;
      color: white;
    }
    .clear {
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Details</h2>
    <form id="studentForm">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name">
  <span class="error" id="nameError"></span>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email">
  <span class="error" id="emailError"></span>

  <label>Gender:</label>
  <input type="radio" id="male" name="gender" value="Male"> Male
  <input type="radio" id="female" name="gender" value="Female"> Female
  <span class="error" id="genderError"></span>

  <label for="mark1">Mark 1:</label>
  <input type="number" id="mark1" name="mark1">
  <span class="error" id="mark1Error"></span>

  <label for="mark2">Mark 2:</label>
  <input type="number" id="mark2" name="mark2">
  <span class="error" id="mark2Error"></span>

  <label for="mark3">Mark 3:</label>
  <input type="number" id="mark3" name="mark3">
  <span class="error" id="mark3Error"></span>

  <div class="buttons">
    <button type="submit" class="submit">Submit</button>
    <button type="reset" class="clear">Clear</button>
  </div>
</form>

<script src="validation.js"></script>

  </div>
</body>
</html>
