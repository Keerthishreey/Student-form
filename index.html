<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    
      padding: 40px;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 400px;
      margin: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      transition: 0.3s;
    }
    .container:hover {
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: 500;
      color: #444;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: border 0.3s;
    }
    input:focus {
      border: 1px solid #4CAF50;
      outline: none;
    }
    .buttons {
      margin-top: 20px;
      text-align: center;
    }
    button {
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .submit {
      background-color: #4CAF50;
      color: white;
    }
    .submit:hover {
      background-color: #45a049;
    }
    .clear {
      background-color: #f44336;
      color: white;
    }
    .clear:hover {
      background-color: #d32f2f;
    }
    .error {
      color: red;
      font-size: 12px;
      margin-top: 3px;
      display: block;
    }

    /* Excel-style Table */
    #tableSection {
      width: 90%;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 20px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #d0d0d0;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #f3f3f3;
      font-weight: bold;
      text-transform: uppercase;
    }
    tr:nth-child(even) {
      background: #fafafa;
    }
    tr:hover {
      background: #eaf3ff;
    }
    p {
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <!-- Form Card -->
  <div class="container">
    <h2>Student Details</h2>
    <form id="studentForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">
      <span class="error" id="nameError"></span>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
      <span class="error" id="emailError"></span>

      <label>Gender:</label>
      <input type="radio" id="male" name="gender" value="Male"> Male
      <input type="radio" id="female" name="gender" value="Female"> Female
      <span class="error" id="genderError"></span>

      <label for="mark1">Mark 1:</label>
      <input type="number" id="mark1" name="mark1">
      <span class="error" id="mark1Error"></span>

      <label for="mark2">Mark 2:</label>
      <input type="number" id="mark2" name="mark2">
      <span class="error" id="mark2Error"></span>

      <label for="mark3">Mark 3:</label>
      <input type="number" id="mark3" name="mark3">
      <span class="error" id="mark3Error"></span>

      <div class="buttons">
        <button type="submit" class="submit">Submit</button>
        <button type="reset" class="clear">Clear</button>
      </div>
    </form>
  </div>

  <!-- Excel-like Table Section -->
  <div id="tableSection">
    <h2 style="text-align:center; margin-bottom:15px; color:#333;">Student Records</h2>
    <div id="tableContainer"></div>
  </div>

  <script src="validation.js"></script>
</body>
</html>
