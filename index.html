<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details Form (Bootstrap)</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow-lg mx-auto" style="max-width: 600px;">
      <div class="card-body">
        <h3 class="text-center mb-4">Student Details</h3>
        <form onsubmit="alert('Form Submitted!'); return false;">
          
          <!-- Name -->
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>

          <!-- Gender -->
          <div class="mb-3">
            <label class="form-label">Gender</label><br>
            <div class="form-check form-check-inline">
              <input type="radio" id="male" name="gender" value="Male" class="form-check-input" required>
              <label for="male" class="form-check-label">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input type="radio" id="female" name="gender" value="Female" class="form-check-input">
              <label for="female" class="form-check-label">Female</label>
            </div>
            <div class="form-check form-check-inline">
              <input type="radio" id="other" name="gender" value="Other" class="form-check-input">
              <label for="other" class="form-check-label">Other</label>
            </div>
          </div>

          <!-- Marks in Row -->
          <div class="row mb-3">
            <div class="col">
              <label for="mark1" class="form-label">Mark 1</label>
              <input type="number" id="mark1" name="mark1" class="form-control">
            </div>
            <div class="col">
              <label for="mark2" class="form-label">Mark 2</label>
              <input type="number" id="mark2" name="mark2" class="form-control">
            </div>
            <div class="col">
              <label for="mark3" class="form-label">Mark 3</label>
              <input type="number" id="mark3" name="mark3" class="form-control">
            </div>
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success">Submit</button>
            <button type="reset" class="btn btn-danger">Clear</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (for future enhancements if needed) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
