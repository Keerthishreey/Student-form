<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="text-center mb-4">Student Details</h2>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Gender</label><br>
          <div class="form-check form-check-inline">
            <input type="radio" id="male" name="gender" value="Male" class="form-check-input">
            <label for="male" class="form-check-label">Male</label>
          </div>
          <div class="form-check form-check-inline">
            <input type="radio" id="female" name="gender" value="Female" class="form-check-input">
            <label for="female" class="form-check-label">Female</label>
          </div>
          <div class="form-check form-check-inline">
            <input type="radio" id="other" name="gender" value="Other" class="form-check-input">
            <label for="other" class="form-check-label">Other</label>
          </div>
        </div>

        <div class="mb-3">
          <label for="mark1" class="form-label">Mark 1</label>
          <input type="number" id="mark1" name="mark1" class="form-control">
        </div>

        <div class="mb-3">
          <label for="mark2" class="form-label">Mark 2</label>
          <input type="number" id="mark2" name="mark2" class="form-control">
        </div>

        <div class="mb-3">
          <label for="mark3" class="form-label">Mark 3</label>
          <input type="number" id="mark3" name="mark3" class="form-control">
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-success">Submit</button>
          <button type="reset" class="btn btn-danger">Clear</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
